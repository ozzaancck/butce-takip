        <p class="sheet-text" style="margin:0">${esc(card.name)} ekstresi bu ay beklenen günden farklı bir günde kesildiyse gerçek tarihi gir. Harcamalar ekstrelere buna göre yeniden dağıtılır.</p>
        <label class="field"><span>Gerçek kesim tarihi</span><input id="f-day" type="date" required></label>
        <div class="actions"><button type="button" class="btn btn-quiet" data-action="sheet-close">Vazgeç</button><button type="submit" class="btn btn-primary">Kaydet</button></div>
      </form>`, { kind: 'cutfix', cardId: id });
    $('#f-day').value = lc;
  }
  function saveCutFix() {
    const f = sheet;
    const day = $('#f-day').value;
    if (!DAY_RE.test(day)) return;
    const ok = commit(() => {
      state.cards = state.cards.map(c => (c.id === f.cardId ? { ...c, cutOverrides: { ...c.cutOverrides, [day.slice(0, 7)]: day } } : c));
    }, 'Kesim tarihi güncellendi');
    if (ok) closeSheet();
  }

  function openAmountFixSheet(id) {
    const card = cardById(id);
    if (!card || !canWrite()) return;
    const st = cardStatus(card);
    openSheet(sheetHead('Ekstre tutarını düzelt') + `
      <form class="form" id="amountfix-form" novalidate>
        <p class="sheet-text" style="margin:0">Uygulamaya göre ${esc(card.name)} kesilen ekstresi <b>${money(st.statementDue)}</b>. Bankanın ekstresindeki tutar farklıysa (faiz, aidat, unutulan harcama) gerçek tutarı gir; fark "Kart düzeltmesi" olarak eklenir.</p>
        <label class="field"><span>Bankadaki ekstre tutarı</span>
          <span class="amount-wrap"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00"><span class="suffix">₺</span></span>
          <small class="err" id="err-amount" hidden>Geçerli bir tutar gir.</small>
        </label>
        <div class="actions"><button type="button" class="btn btn-quiet" data-action="sheet-close">Vazgeç</button><button type="submit" class="btn btn-primary">Kaydet</button></div>
      </form>`, { kind: 'amountfix', cardId: id, expected: st.statementDue, day: st.lastCut });
    $('#f-amount').focus();
  }
  function saveAmountFix() {
    const f = sheet;
    const real = parseAmountOrZero($('#f-amount').value);
    $('#err-amount').hidden = real !== null;
    if (real === null) return;
    const d = real - f.expected;
    if (d === 0) { closeSheet(); toast('Ekstre tutuyor, fark yok'); return; }
    const e = { id: newId(), type: d > 0 ? 'expense' : 'income', amount: Math.abs(d), categoryId: null, note: 'Ekstre düzeltmesi', isSalary: false, method: 'card:' + f.cardId, system: 'cardadj', day: f.day, createdAt: Date.now() };
    if (commit(() => { state.entries.push(e); }, 'Kart düzeltmesi eklendi')) closeSheet();
  }

  // ---------- Yedekleme ----------
  function lastBackupText() {
    try {
      const t = Number(localStorage.getItem(BACKUP_KEY));
      return t ? dateTimeFmt.format(new Date(t)) : 'Hiç alınmadı';
    } catch (e) {
      return 'Bilinmiyor';
    }
  }
  function openBackupSheet() {
    const html = sheetHead('Yedekleme') + `
      <p class="sheet-text">Kayıtların sadece bu cihazda duruyor. Uygulamayı ana ekrandan silersen ya da telefon değiştirirsen kaybolur. Ara sıra yedek al ve dosyayı iCloud Drive'a (Dosyalar'a) kaydet.</p>
      <dl class="facts">
        <dt>Kayıtlar</dt><dd>${state.entries.length} işlem, ${state.categories.length} kategori</dd>
        <dt>Son yedek</dt><dd>${esc(lastBackupText())}</dd>
      </dl>
      <div id="backup-body" class="backup-grid" style="margin-top:16px">
        <button type="button" class="btn btn-primary btn-block" data-action="export">${ICON.download}Yedeği dışa aktar</button>
        <label class="btn btn-quiet btn-block" for="import-file">${ICON.upload}Yedekten geri yükle</label>
        <input type="file" id="import-file" class="visually-hidden" accept="application/json,.json">
      </div>`;
    openSheet(html, { kind: 'backup' });
    $('#sheet-root .sheet-head .icon-btn').focus({ preventScroll: true });
  }

  async function exportBackup() {
    const payload = Object.assign({ app: 'butce-takip', exportedAt: new Date().toISOString() }, snapshot());
    const name = `butce-yedek-${today()}.json`;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    let done = false;
    try {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Bütçe yedeği' });
        done = true;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    if (!done) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) { /* önemsiz */ }
    closeSheet();
    toast('Yedek hazırlandı');
  }

  function handleImportFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(String(reader.result)); } catch (e) { data = null; }
      const body = $('#backup-body');
      if (!body || !sheet || sheet.kind !== 'backup') return;
      if (!data || data.app !== 'butce-takip' || !Array.isArray(data.entries) || !Array.isArray(data.categories)) {
        toast('Bu dosya bir Bütçe Takip yedeği değil.');
        return;
      }
      const pending = migrate(data);
      sheet.pending = pending;
      const extra = pending.transfers.length ? `, ${pending.transfers.length} transfer` : '';
      body.innerHTML = `<div class="confirm-inline"><p>Yedekte ${pending.entries.length} işlem${extra} ve ${pending.categories.length} kategori var. Şu anki kayıtların silinip yerine yedektekiler yüklenecek.</p>
        <div class="actions"><button type="button" class="btn btn-quiet" data-action="sheet-close">Vazgeç</button>
        <button type="button" class="btn btn-danger" data-action="import-confirm">Geri yükle</button></div></div>`;
      body.querySelector('.btn-quiet').focus();
    };
    reader.onerror = () => toast('Dosya okunamadı.');
    reader.readAsText(file);
  }

  // ---------- Olaylar ----------
  // ---------- Sola kaydırarak silme ----------
  const SWIPE_W = 88;
  let swipe = null, swipeMoved = false;
  function closeSwipes(except) {
    document.querySelectorAll('.swipe.open').forEach(b => {
      if (b === except) return;
      b.classList.remove('open');
      b.querySelector('.row').style.transform = '';
    });
  }
  document.addEventListener('touchstart', e => {
    swipeMoved = false;
    const row = e.target.closest('.swipe > .row');
    if (!row) { if (!e.target.closest('.swipe-del')) closeSwipes(null); return; }
    const box = row.parentElement;
    closeSwipes(box);
    const p0 = e.touches[0];
    swipe = { box, row, x0: p0.clientX, y0: p0.clientY, base: box.classList.contains('open') ? -SWIPE_W : 0, dir: null, x: 0 };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!swipe) return;
    const p1 = e.touches[0], dx = p1.clientX - swipe.x0, dy = p1.clientY - swipe.y0;
    if (!swipe.dir) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      swipe.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if (swipe.dir === 'h') swipe.box.classList.add('dragging');
    }
    if (swipe.dir !== 'h') return;   // dikey kaydırma sayfayı kaydırır
    e.preventDefault();
    swipeMoved = true;
    swipe.x = Math.max(-SWIPE_W - 24, Math.min(0, swipe.base + dx));
    swipe.row.style.transform = `translateX(${swipe.x}px)`;
  }, { passive: false });
  const endSwipe = () => {
    if (!swipe) return;
    const sw = swipe;
    swipe = null;
    sw.box.classList.remove('dragging');
    if (sw.dir !== 'h') return;
    setTimeout(() => { swipeMoved = false; }, 350);
    const open = sw.x < -SWIPE_W / 2;
    sw.box.classList.toggle('open', open);
    sw.row.style.transform = open ? `translateX(${-SWIPE_W}px)` : '';
  };
  document.addEventListener('touchend', endSwipe);
  document.addEventListener('touchcancel', endSwipe);

  document.addEventListener('click', e => {
    // Kaydırma hareketinden sonra gelen tıklamayı yok say; açık satıra dokunmak onu kapatır
    if (swipeMoved) { swipeMoved = false; e.preventDefault(); return; }
    const openBox = e.target.closest('.swipe.open');
    if (openBox && !e.target.closest('.swipe-del')) { closeSwipes(null); return; }
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const a = t.dataset.action;
    const id = t.dataset.id;
    switch (a) {
      case 'tab': go(t.dataset.view); break;
      case 'back': go(state.prevView || 'categories'); break;
      case 'backup': openBackupSheet(); break;
      case 'backup-snooze':
        try { localStorage.setItem(SNOOZE_KEY, String(Date.now() + 7 * 86400000)); } catch (e) { /* önemsiz */ }
        render();
        break;
      case 'export': exportBackup(); break;
      case 'import-confirm': {
        const p = sheet && sheet.pending;
        if (!p) break;
        const ok = commit(() => { for (const k of COLLECTIONS) state[k] = p[k]; }, 'Yedek geri yüklendi');
        if (ok) closeSheet();
        break;
      }
      case 'add-income': openEntrySheet({ type: 'income' }); break;
      case 'add-expense': openEntrySheet({ type: 'expense' }); break;
      case 'fab':
        if (state.view === 'category') openEntrySheet({ type: 'expense', categoryId: state.detailCat });
        else openEntrySheet({ type: state.filter === 'income' ? 'income' : 'expense' });
        break;
      case 'period-prev':
      case 'period-next': {
        const ps = getPeriods();
        const i = selectedPeriod(ps).index + (a === 'period-prev' ? -1 : 1);
        if (ps[i]) { state.period = i === ps.length - 1 ? null : ps[i].key; render(); }
        break;
      }
      case 'select-period': {
        const ps = getPeriods();
        state.period = ps.length && ps[ps.length - 1].key === t.dataset.period ? null : t.dataset.period;
        render();
        break;
      }
      case 'open-entry': openEntrySheet({ id }); break;
      case 'filter': state.filter = t.dataset.filter; render(); break;
      case 'clear-filters': state.q = ''; state.range = 'all'; state.from = ''; state.to = ''; state.catFilter = ''; render(); break;
      case 'open-category':
        if (state.view !== 'category') state.prevView = state.view;
        state.view = 'category';
        state.detailCat = id || NONE;
        render();
        window.scrollTo(0, 0);
        break;
      case 'new-category': openCategorySheet(); break;
      case 'edit-category': openCategorySheet(id); break;
      case 'delete-category': askDeleteCategory(id); break;
      case 'sheet-close': closeSheet(); break;
      case 'form-type':
        if (sheet && sheet.kind === 'entry') { sheet.type = t.dataset.type; applyEntryType(); }
        break;
      case 'quick-fill': {
        const src = state.entries.find(e => e.id === id);
        if (!src || !sheet || sheet.kind !== 'entry') break;
        $('#f-amount').value = amountToInput(src.amount);
        $('#err-amount').hidden = true;
        sheet.categoryId = src.categoryId;
        if (methodOptions('expense').includes(src.method)) sheet.method = src.method;
        $('#err-cat').hidden = true;
        renderChips(); renderMethods();
        $('#f-save').focus({ preventScroll: true });
        break;
      }
      case 'pick-method':
        if (sheet && sheet.kind === 'entry') { sheet.method = t.dataset.method; renderMethods(); }
        break;
      case 'transfer-new': openTransferSheet(); break;
      case 'open-transfer': openTransferSheet(id); break;
      case 'transfer-kind':
        if (sheet && sheet.kind === 'transfer') { sheet.tkind = t.dataset.kind; applyTransferKind(); }
        break;
      case 'transfer-delete': {
        const f = sheet;
        if (!f || !f.id) break;
        closeSheet();
        deleteWithUndo('transfer', f.id);
        break;
      }
      case 'wallet-count': openWalletCountSheet(); break;
      case 'open-card': openCardSheet(id); break;
      case 'rec-new': openRecurringSheet(); break;
      case 'rec-edit': openRecurringSheet(id); break;
      case 'rec-type': if (sheet && sheet.kind === 'recurring') { sheet.type = t.dataset.type; applyRecType(); } break;
      case 'rec-cat': if (sheet && sheet.kind === 'recurring') { sheet.categoryId = id; $('#err-cat').hidden = true; applyRecType(); } break;
      case 'rec-method': if (sheet && sheet.kind === 'recurring') { sheet.method = t.dataset.method; applyRecType(); } break;
      case 'rec-delete': {
        const f = sheet;
        if (!f || !f.id) break;
        if (commit(() => { state.recurring = state.recurring.filter(x => x.id !== f.id); }, 'Düzenli işlem silindi')) closeSheet();
        break;
      }
      case 'rec-add':
      case 'rec-skip': {
        const x = pendingRecurring().find(p => p.r.id === id && p.ym === t.dataset.month);
        if (x) applyRecurring([x], a === 'rec-add' ? 'added' : 'skipped');
        break;
      }
      case 'rec-add-all': applyRecurring(pendingRecurring(), 'added'); break;
      case 'card-new': openCardEditSheet(); break;
      case 'card-edit': openCardEditSheet(id); break;
      case 'card-delete': deleteCard(id); break;
      case 'card-pay': openCardPaySheet({ cardId: id || null }); break;
      case 'card-fix-date': openCutFixSheet(id); break;
      case 'card-fix-amount': openAmountFixSheet(id); break;
      case 'cp-card': if (sheet && sheet.kind === 'cardpay') { sheet.cardId = id; renderCardPay(!sheet.id); } break;
      case 'cp-from': if (sheet && sheet.kind === 'cardpay') { sheet.from = t.dataset.method; renderCardPay(false); } break;
      case 'pick-cat':
        if (sheet && sheet.kind === 'entry') { sheet.categoryId = id; $('#err-cat').hidden = true; renderChips(); }
        break;
      case 'nc-open':
        if (sheet && sheet.kind === 'entry') { $('#newcat').hidden = false; $('#nc-name').focus(); }
        break;
      case 'nc-cancel':
        $('#newcat').hidden = true; $('#nc-err').hidden = true; $('#nc-name').value = '';
        break;
      case 'nc-color':
        if (sheet && sheet.kind === 'entry') { sheet.ncColor = Number(t.dataset.color); markSwatches($('#nc-swatches'), sheet.ncColor); }
        break;
      case 'nc-save': saveInlineCategory(); break;
      case 'cs-color':
        if (sheet && sheet.kind === 'category') { sheet.color = Number(t.dataset.color); markSwatches($('#c-swatches'), sheet.color); updateCategoryPreview(); }
        break;
      case 'entry-delete': {
        const f = sheet;
        if (!f || f.kind !== 'entry' || !f.id) break;
        closeSheet();
        deleteWithUndo('entry', f.id);
        break;
      }
      case 'swipe-delete': closeSwipes(null); deleteWithUndo(t.dataset.kind, id); break;
      case 'toast-action': {
        const act = toastAction;
        $('#toast').hidden = true; toastAction = null; clearTimeout(toastTimer);
        if (act) act.run();
        break;
      }
      case 'confirm-ok': {
        const f = sheet;
        if (!f || f.kind !== 'confirm') break;
        if (f.onConfirm()) closeSheet();
        break;
      }
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'q') {
      state.q = el.value;
      refreshResults();
      return;
    }
    if (el.id === 'f-amount' || el.id === 'c-limit') {
      const clean = sanitizeAmount(el.value);
      if (clean !== el.value) el.value = clean;
      if (el.id === 'c-limit') { $('#c-limit-err').hidden = true; return; }
      $('#err-amount').hidden = true;
      if (sheet && sheet.kind === 'wallet') updateWalletDiff();
    } else if (el.id === 'c-name') {
      $('#c-err').hidden = true;
      updateCategoryPreview();
    } else if (el.id === 'r-day') {
      el.value = el.value.replace(/\D/g, '').slice(0, 2);
      $('#err-day').hidden = true;
      updateRecFirst();
    } else if (el.id === 'f-note') {
      if (sheet && sheet.kind === 'entry' && !sheet.salaryTouched) $('#f-salary').checked = isSalaryNote(el.value);
    } else if (el.id === 'nc-name') {
      $('#nc-err').hidden = true;
    }
  });

  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'range' || id === 'catf' || id === 'from' || id === 'to') {
      if (id === 'range') state.range = e.target.value;
      if (id === 'catf') state.catFilter = e.target.value;
      if (id === 'from') state.from = e.target.value;
      if (id === 'to') state.to = e.target.value;
      render();
      return;
    }
    if (e.target.id === 'f-salary' && sheet && sheet.kind === 'entry') sheet.salaryTouched = true;
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
      handleImportFile(e.target.files[0]);
      e.target.value = '';
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'entry-form') saveEntry();
    else if (e.target.id === 'transfer-form') saveTransfer();
    else if (e.target.id === 'wallet-form') saveWalletCount();
    else if (e.target.id === 'card-form') saveCard();
    else if (e.target.id === 'rec-form') saveRecurring();
    else if (e.target.id === 'cardpay-form') saveCardPay();
    else if (e.target.id === 'cutfix-form') saveCutFix();
    else if (e.target.id === 'amountfix-form') saveAmountFix();
    else if (e.target.id === 'cat-form') saveCategory();
  });

  document.addEventListener('keydown', e => {
    if (!sheet) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Enter' && e.target.id === 'nc-name') { e.preventDefault(); saveInlineCategory(); return; }
    if (e.key === 'Tab') {
      const items = [...$('#sheet-root').querySelectorAll('button:not([disabled]), input:not([disabled]):not([type="file"]), label.btn')]
        .filter(el => el.offsetParent !== null);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  // Halka grafikte dilimin üstüne gelince / dokununca ortada o kategoriyi göster
  document.addEventListener('pointerover', e => {
    const el = e.target.closest && e.target.closest('[data-slice]');
    if (el) setDonutFocus(Number(el.dataset.slice));
  });
  document.addEventListener('pointerout', e => {
    const from = e.target.closest && e.target.closest('[data-slice]');
    if (!from) return;
    const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-slice]') : null;
    if (!to) setDonutFocus(null);
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-slice]');
    if (el) setDonutFocus(Number(el.dataset.slice));
  });

  // Aynı uygulama başka bir sekmede değişirse bu sekmeyi de güncelle
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || sheet) return;
    const data = readStore();
    if (data) { applyData(data); render(); }
  });

  loadInitial();
  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
