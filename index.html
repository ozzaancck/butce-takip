<script>
(() => {
  'use strict';

  const TR = 'tr-TR';
  const NONE = '__none__';
  const STORE_KEY = 'butce-takip:v1';
  const BACKUP_KEY = 'butce-takip:lastBackup';
  const SNOOZE_KEY = 'butce-takip:backupSnooze';
  const $ = (sel, root = document) => root.querySelector(sel);

  // ---------- Biçimlendirme ----------
  const moneyFmt = new Intl.NumberFormat(TR, { style: 'currency', currency: 'TRY' });
  const compactFmt = new Intl.NumberFormat(TR, { notation: 'compact', maximumFractionDigits: 1 });
  const pctFmt = new Intl.NumberFormat(TR, { style: 'percent', maximumFractionDigits: 1 });
  const monthFmt = new Intl.DateTimeFormat(TR, { month: 'long', year: 'numeric' });
  const monthShortFmt = new Intl.DateTimeFormat(TR, { month: 'short' });
  const dayFmt = new Intl.DateTimeFormat(TR, { day: 'numeric', month: 'long', weekday: 'long' });
  const dateTimeFmt = new Intl.DateTimeFormat(TR, { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  const money = k => moneyFmt.format(k / 100);
  const signed = (k, type) => (type === 'income' ? '+' : '−') + money(k);
  const compact = k => '₺' + compactFmt.format(k / 100);
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initial = name => (Array.from(name.trim())[0] || '?').toLocaleUpperCase(TR);
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  const currentMonth = () => today().slice(0, 7);
  function addMonths(key, n) {
    let [y, m] = key.split('-').map(Number);
    const idx = y * 12 + (m - 1) + n;
    y = Math.floor(idx / 12);
    m = idx - y * 12 + 1;
    return `${y}-${pad(m)}`;
  }
  const monthDate = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1); };
  const monthName = key => monthFmt.format(monthDate(key));
  const monthShort = key => monthShortFmt.format(monthDate(key));
  const dayName = s => { const [y, m, d] = s.split('-').map(Number); return dayFmt.format(new Date(y, m - 1, d)); };

  // Tutar girişi: sadece rakam ve tek ondalık ayırıcı (en fazla 2 hane)
  function sanitizeAmount(raw) {
    let out = '', sep = false, dec = 0;
    for (const ch of raw) {
      if (ch >= '0' && ch <= '9') {
        if (!sep) out += ch;
        else if (dec < 2) { out += ch; dec++; }
      } else if ((ch === ',' || ch === '.') && !sep) {
        sep = true; out += ',';
      }
    }
    return out.slice(0, 13);
  }
  // "1250,5" -> 125050 kuruş; geçersiz ya da sıfırsa null
  function parseAmount(text) {
    const t = text.trim();
    if (!t || t === ',') return null;
    const [i, f = ''] = t.split(',');
    const intPart = i === '' ? '0' : i;
    if (!/^\d+$/.test(intPart) || !/^\d{0,2}$/.test(f)) return null;
    const k = Number(intPart) * 100 + Number((f + '00').slice(0, 2));
    return Number.isSafeInteger(k) && k > 0 ? k : null;
  }
  function amountToInput(k) {
    const i = Math.floor(k / 100), f = k % 100;
    if (f === 0) return String(i);
    return i + ',' + pad(f).replace(/0$/, '');
  }

  // ---------- Renkler ----------
  const colorVar = c => c === null || c === undefined ? 'var(--neutral)' : c === 'other' ? 'var(--other)' : `var(--c${c})`;
  const inkVar = c => typeof c === 'number' ? `var(--ci${c})` : '#ffffff';
  const catStyle = c => `--cat:${colorVar(c)};--cat-ink:${inkVar(c)}`;

  const ICON = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>',
    swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>',
  };

  const DEFAULT_CATEGORIES = [
    ['market', 'Market'], ['faturalar', 'Faturalar'], ['ulasim', 'Ulaşım'], ['yemek', 'Yemek'],
    ['eglence', 'Eğlence'], ['saglik', 'Sağlık'], ['kira', 'Kira'], ['giyim', 'Giyim'],
  ];

  // ---------- Durum ----------
  const DATA_VERSION = 2;
  const COLLECTIONS = ['categories', 'entries', 'transfers', 'cards', 'recurring'];
  const state = {
    storageOk: true,
    entries: [],
    categories: [],
    transfers: [],
    cards: [],
    recurring: [],
    view: 'home',           // home | entries | categories | category
    prevView: 'categories',
    period: null,          // seçili maaş döneminin anahtarı (null = içinde bulunulan dönem)
    filter: 'all',
    q: '', range: 'all', from: '', to: '', catFilter: '',
    detailCat: null,
  };
  let sheet = null;
  let lastFocus = null;
  let donutSlices = [];
  let donutTotal = 0;

  const canWrite = () => state.storageOk;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  // ---------- Veri doğrulama (eski ve yeni sürüm kayıtlarını aynı biçime getirir) ----------
  const PALETTE_SIZE = 16;
  const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  const MONTH_RE = /^\d{4}-\d{2}$/;
  const str = (v, max) => (typeof v === 'string' ? v.slice(0, max) : '');
  const idOf = v => (typeof v === 'string' && v ? v.slice(0, 64) : newId());
  const posInt = v => (Number.isSafeInteger(v) && v > 0 ? v : null);
  const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const isSalaryNote = note => /maa[şs]/.test(String(note || '').toLocaleLowerCase(TR));
  const validMethod = (m, type) => {
    if (m === 'bank' || m === 'wallet') return m;
    if (type === 'expense' && typeof m === 'string' && /^card:.{1,64}$/.test(m)) return m;
    return 'bank';
  };

  function toEntry(d, fromV1) {
    if (!d || typeof d !== 'object') return null;
    const type = d.type === 'income' || d.type === 'expense' ? d.type : null;
    const amount = posInt(d.amount);
    const day = typeof d.day === 'string' && DAY_RE.test(d.day) ? d.day : null;
    if (!type || amount === null || !day) return null;
    const note = str(d.note, 120);
    const system = d.system === 'cardadj' || d.system === 'walletdiff' ? d.system : null;
    let method = validMethod(d.method, type);
    // Kart borcunu azaltan düzeltme, karta yazılmış bir gelir olarak tutulur
    if (system === 'cardadj' && typeof d.method === 'string' && /^card:.{1,64}$/.test(d.method)) method = d.method;
    return {
      id: idOf(d.id),
      type, amount, day, note, method, system,
      categoryId: !system && typeof d.categoryId === 'string' ? d.categoryId.slice(0, 64) : null,
      isSalary: type === 'income' && !system ? (fromV1 ? isSalaryNote(note) : d.isSalary === true) : false,
      createdAt: num(d.createdAt),
    };
  }
  function toCategory(d) {
    if (!d || typeof d !== 'object' || typeof d.name !== 'string' || !d.name.trim()) return null;
    const color = Number.isInteger(d.color) && d.color >= 0 && d.color < PALETTE_SIZE ? d.color : 0;
    return {
      id: idOf(d.id),
      name: d.name.trim().slice(0, 30), color,
      limit: posInt(d.limit),
      createdAt: num(d.createdAt),
    };
  }
  function toTransfer(d) {
    if (!d || typeof d !== 'object') return null;
    const kind = ['withdraw', 'deposit', 'cardpay'].includes(d.kind) ? d.kind : null;
    const amount = posInt(d.amount);
    const day = typeof d.day === 'string' && DAY_RE.test(d.day) ? d.day : null;
    if (!kind || amount === null || !day) return null;
    if (kind === 'cardpay' && (typeof d.cardId !== 'string' || !d.cardId)) return null;
    return {
      id: idOf(d.id), kind, amount, day,
      from: kind === 'cardpay' ? (d.from === 'wallet' ? 'wallet' : 'bank') : null,
      cardId: kind === 'cardpay' ? d.cardId.slice(0, 64) : null,
      note: str(d.note, 80),
      createdAt: num(d.createdAt),
    };
  }
  const clampDay = v => (Number.isInteger(v) && v >= 1 && v <= 31 ? v : null);
  function toCard(d) {
    if (!d || typeof d !== 'object' || typeof d.name !== 'string' || !d.name.trim()) return null;
    const cutDay = clampDay(d.cutDay), dueDay = clampDay(d.dueDay);
    if (!cutDay || !dueDay) return null;
    const cutOverrides = {};
    if (d.cutOverrides && typeof d.cutOverrides === 'object') {
      for (const [m, v] of Object.entries(d.cutOverrides)) {
        if (MONTH_RE.test(m) && typeof v === 'string' && DAY_RE.test(v)) cutOverrides[m] = v;
      }
    }
    return { id: idOf(d.id), name: d.name.trim().slice(0, 24), cutDay, dueDay, cutOverrides, archived: d.archived === true, createdAt: num(d.createdAt) };
  }
  function toRecurring(d) {
    if (!d || typeof d !== 'object') return null;
    const type = d.type === 'income' || d.type === 'expense' ? d.type : null;
    const amount = posInt(d.amount);
    const dayOfMonth = clampDay(d.dayOfMonth);
    if (!type || amount === null || !dayOfMonth) return null;
    const handled = {};
    if (d.handled && typeof d.handled === 'object') {
      for (const [m, v] of Object.entries(d.handled)) if (MONTH_RE.test(m) && (v === 'added' || v === 'skipped')) handled[m] = v;
    }
    return {
      id: idOf(d.id), type, amount, dayOfMonth,
      categoryId: type === 'expense' && typeof d.categoryId === 'string' ? d.categoryId.slice(0, 64) : null,
      note: str(d.note, 80),
      method: validMethod(d.method, type),
      isSalary: type === 'income' && d.isSalary === true,
      startMonth: typeof d.startMonth === 'string' && MONTH_RE.test(d.startMonth) ? d.startMonth : currentMonth(),
      handled,
      active: d.active !== false,
      createdAt: num(d.createdAt),
    };
  }
  const byName = (a, b) => a.name.localeCompare(b.name, TR);
  const byDate = (a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : b.createdAt - a.createdAt);

  // Her sürümden veriyi güncel biçime çevirir (eski kayıtlar kaybolmaz)
  function migrate(data) {
    const v1 = !data || !Number.isInteger(data.version) || data.version < 2;
    const list = k => (data && Array.isArray(data[k]) ? data[k] : []);
    return {
      version: DATA_VERSION,
      categories: list('categories').map(toCategory).filter(Boolean),
      entries: list('entries').map(e => toEntry(e, v1)).filter(Boolean),
      transfers: list('transfers').map(toTransfer).filter(Boolean),
      cards: list('cards').map(toCard).filter(Boolean),
      recurring: list('recurring').map(toRecurring).filter(Boolean),
    };
  }
  function sortAll() {
    state.categories.sort(byName);
    state.entries.sort(byDate);
    state.transfers.sort(byDate);
    state.cards.sort(byName);
  }
  function applyData(data) {
    const m = migrate(data);
    for (const k of COLLECTIONS) state[k] = m[k];
    sortAll();
  }
  function snapshot() {
    const o = { version: DATA_VERSION };
    for (const k of COLLECTIONS) o[k] = state[k];
    return o;
  }

  // ---------- Telefonda saklama ----------
  function readStore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw === null ? null : JSON.parse(raw);
    } catch (e) {
      return undefined;
    }
  }
  function writeStore() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(snapshot()));
      return true;
    } catch (e) {
      return false;
    }
  }
  let persistAsked = false;
  // Değişikliği uygula ve kaydet; kaydedilemezse eski haline döndür
  function commit(mutate, okMessage) {
    const before = JSON.stringify(snapshot());
    mutate();
    sortAll();
    if (!writeStore()) {
      applyData(JSON.parse(before));
      toast('Kaydedilemedi. Telefonda yer kalmamış olabilir.');
      render();
      return false;
    }
    if (!persistAsked && navigator.storage && navigator.storage.persist) {
      persistAsked = true;
      navigator.storage.persist().catch(() => {});
    }
    render();
    if (okMessage) toast(okMessage);
    return true;
  }

  function loadInitial() {
    const data = readStore();
    if (data === undefined) {
      state.storageOk = false;
      return;
    }
    if (data === null) {
      // İlk açılış: hazır kategorileri oluştur
      const now = Date.now();
      state.categories = DEFAULT_CATEGORIES.map(([id, name], i) => ({ id, name, color: i, limit: null, createdAt: now })).sort(byName);
      state.storageOk = writeStore();
      return;
    }
    const oldVersion = data && data.version;
    applyData(data);
    // Eski sürümden geldiyse önce eski hali ayrı anahtara yedekle, sonra yeni biçimde kaydet
    if (oldVersion !== DATA_VERSION) {
      try { localStorage.setItem(STORE_KEY + ':pre-v' + DATA_VERSION, JSON.stringify(data)); } catch (e) { /* yer yoksa geç */ }
      state.storageOk = writeStore();
    }
  }

  // ---------- Hesaplar ----------
  function catMap() {
    const m = new Map();
    for (const c of state.categories) m.set(c.id, c);
    return m;
  }
  // Silinmiş kategoriye bağlı harcama "Kategorisiz" sayılır
  const catOf = (e, map) => (e.categoryId && map.has(e.categoryId) ? map.get(e.categoryId) : null);
  function totals(list) {
    let inc = 0, exp = 0;
    for (const e of list) { if (e.type === 'income') inc += e.amount; else if (e.type === 'expense') exp += e.amount; }
    return { inc, exp, net: inc - exp };
  }

  // ---------- Hesaplar: banka, cüzdan, ödeme yöntemleri ----------
  const SYSTEM_NAMES = { walletdiff: 'Cüzdan farkı', cardadj: 'Kart düzeltmesi' };
  const TRANSFER_NAMES = { withdraw: 'Para çekme', deposit: 'Bankaya yatırma', cardpay: 'Kart borcu ödemesi' };
  const cardById = id => state.cards.find(c => c.id === id) || null;
  const activeCards = () => state.cards.filter(c => !c.archived);
  function methodName(m) {
    if (m === 'bank') return 'Banka';
    if (m === 'wallet') return 'Cüzdan';
    const c = typeof m === 'string' && m.startsWith('card:') ? cardById(m.slice(5)) : null;
    return c ? c.name : 'Kart';
  }
  function accountBalances() {
    let bank = 0, wallet = 0;
    for (const e of state.entries) {
      const v = e.type === 'income' ? e.amount : -e.amount;
      if (e.method === 'bank') bank += v;
      else if (e.method === 'wallet') wallet += v;
    }
    for (const t of state.transfers) {
      if (t.kind === 'withdraw') { bank -= t.amount; wallet += t.amount; }
      else if (t.kind === 'deposit') { wallet -= t.amount; bank += t.amount; }
      else if (t.kind === 'cardpay') { if (t.from === 'wallet') wallet -= t.amount; else bank -= t.amount; }
    }
    return { bank, wallet, cash: bank + wallet };
  }
  // ---------- Kredi kartı ekstreleri ----------
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  // Kartın verilen aydaki hesap kesim tarihi (elle düzeltildiyse o tarih)
  const cutDate = (card, ym) => card.cutOverrides[ym] || `${ym}-${pad(Math.min(card.cutDay, daysInMonth(ym)))}`;
  // Bugüne kadar kesilmiş son ekstrenin tarihi
  function lastCut(card, ref = today()) {
    const ym = ref.slice(0, 7);
    const c = cutDate(card, ym);
    return c <= ref ? c : cutDate(card, addMonths(ym, -1));
  }
  function nextCut(card, ref = today()) {
    const ym = ref.slice(0, 7);
    const c = cutDate(card, ym);
    return c > ref ? c : cutDate(card, addMonths(ym, 1));
  }
  // Son ödeme günü kesim gününden büyükse aynı ay, değilse sonraki ay
  function dueDateFor(card, cut) {
    const ym = card.dueDay > Number(cut.slice(8)) ? cut.slice(0, 7) : addMonths(cut.slice(0, 7), 1);
    return `${ym}-${pad(Math.min(card.dueDay, daysInMonth(ym)))}`;
  }
  function cardStatus(card) {
    const m = 'card:' + card.id;
    const lc = lastCut(card);
    let through = 0, after = 0, paid = 0, count = 0;
    for (const e of state.entries) {
      if (e.method !== m) continue;
      const v = e.type === 'expense' ? e.amount : -e.amount;
      if (e.day <= lc) through += v; else after += v;
      count++;
    }
    for (const t of state.transfers) if (t.kind === 'cardpay' && t.cardId === card.id) { paid += t.amount; count++; }
    const statementDue = Math.max(0, through - paid);
    const overpay = Math.max(0, paid - through);
    return {
      card, lastCut: lc, nextCut: nextCut(card), due: dueDateFor(card, lc),
      statementDue, newStatement: after - overpay, total: through + after - paid, used: count > 0,
    };
  }
  const cardsUsed = () => state.cards.length > 0;

  // Cüzdan hiç kullanılmadıysa arayüzde gösterilmez
  const walletUsed = () => state.entries.some(e => e.method === 'wallet') || state.transfers.some(t => t.kind !== 'cardpay' || t.from === 'wallet');
  function methodOptions(type) {
    const opts = ['bank', 'wallet'];
    if (type === 'expense') for (const c of activeCards()) opts.push('card:' + c.id);
    return opts;
  }
  // En sık kullanılan ödeme yöntemi (son 200 kayıt)
  function preferredMethod(type) {
    const valid = methodOptions(type);
    const count = new Map();
    for (const e of state.entries.slice(0, 200)) {
      if (e.type !== type || e.system || !valid.includes(e.method)) continue;
      count.set(e.method, (count.get(e.method) || 0) + 1);
    }
    let best = 'bank', n = 0;
    for (const [m, c] of count) if (c > n) { best = m; n = c; }
    return best;
  }

  // ---------- Tarih yardımcıları ----------
  const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const dayStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); };
  const utcDay = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const daysBetween = (a, b) => Math.round((utcDay(b) - utcDay(a)) / 86400000);
  const shortDayFmt = new Intl.DateTimeFormat(TR, { day: 'numeric', month: 'short' });
  const shortDayYearFmt = new Intl.DateTimeFormat(TR, { day: 'numeric', month: 'short', year: 'numeric' });
  const longDayFmt = new Intl.DateTimeFormat(TR, { day: 'numeric', month: 'long' });
  const shortDay = s => (s.slice(0, 4) === today().slice(0, 4) ? shortDayFmt : shortDayYearFmt).format(parseDay(s));

  // ---------- Maaş dönemleri ----------
  // "Maaş" işaretli her gelir yeni bir dönem başlatır; açık dönemin bitişi yoktur.
  function getPeriods() {
    const days = state.entries.map(e => e.day).concat(state.transfers.map(t => t.day));
    const salaries = [...new Set(state.entries.filter(e => e.isSalary).map(e => e.day))].sort();
    const earliest = days.length ? days.reduce((a, b) => (a < b ? a : b)) : today();
    const out = [];
    if (!salaries.length) {
      out.push({ key: 'start', start: earliest, end: null, initial: true });
    } else {
      if (earliest < salaries[0]) out.push({ key: 'start', start: earliest, end: addDays(salaries[0], -1), initial: true });
      salaries.forEach((s, i) => out.push({ key: s, start: s, end: i + 1 < salaries.length ? addDays(salaries[i + 1], -1) : null }));
    }
    out.forEach((p, i) => { p.index = i; });
    return out;
  }
  const inPeriod = (day, p) => day >= p.start && (p.end === null || day <= p.end);
  const currentPeriod = periods => periods[periods.length - 1];
  function selectedPeriod(periods) {
    return periods.find(p => p.key === state.period) || currentPeriod(periods);
  }
  function periodRange(p) {
    return p.end === null ? `${shortDay(p.start)} – bugün` : p.start === p.end ? shortDay(p.start) : `${shortDay(p.start)} – ${shortDay(p.end)}`;
  }
  function periodTitle(p) {
    if (p.initial) return 'Başlangıç dönemi';
    return p.end === null ? 'Açık dönem' : `${longDayFmt.format(parseDay(p.start))} dönemi`;
  }
  const periodLength = p => daysBetween(p.start, p.end === null ? today() : p.end) + 1;
  // Bir kaydın hangi döneme düştüğü (gruplama için)
  function periodOfDay(day, periods) {
    for (let i = periods.length - 1; i >= 0; i--) if (day >= periods[i].start) return periods[i];
    return periods[0];
  }

  function expenseSlices(p, map) {
    const byCat = new Map();
    let total = 0;
    for (const e of state.entries) {
      if (e.type !== 'expense' || !inPeriod(e.day, p)) continue;
      const c = catOf(e, map);
      const key = e.system ? 'sys:' + e.system : c ? c.id : NONE;
      byCat.set(key, (byCat.get(key) || 0) + e.amount);
      total += e.amount;
    }
    if (!total) return { total: 0, slices: [] };
    let slices = [...byCat].map(([key, amount]) => {
      if (key.startsWith('sys:')) return { key, name: SYSTEM_NAMES[key.slice(4)], color: 'other', amount, fraction: amount / total, system: true };
      const c = key === NONE ? null : map.get(key);
      return { key, name: c ? c.name : 'Kategorisiz', color: c ? c.color : null, amount, fraction: amount / total };
    }).sort((a, b) => b.amount - a.amount);
    // 8'den fazla dilim olursa en büyük 7'si kalır, gerisi tek dilimde toplanır
    if (slices.length > 8) {
      const kept = slices.slice(0, 7), rest = slices.slice(7);
      const amount = rest.reduce((s, x) => s + x.amount, 0);
      slices = [...kept, { key: null, name: `Diğer kategoriler (${rest.length})`, color: 'other', amount, fraction: amount / total, folded: true }];
    }
    return { total, slices };
  }

  // Seçili dönem son 6 dönemin içindeyse en güncel 6 dönem, değilse seçili dönemle biten 6 dönem
  function periodBars(periods, selected) {
    const last = periods.length - 1;
    const endIdx = selected.index > last - 6 ? last : selected.index;
    const list = periods.slice(Math.max(0, endIdx - 5), endIdx + 1);
    return list.map(p => {
      const t = totals(state.entries.filter(e => inPeriod(e.day, p)));
      return { period: p, inc: t.inc, exp: t.exp };
    });
  }

  // ---------- Düzenli işlemler ----------
  const occurrenceDay = (r, ym) => `${ym}-${pad(Math.min(r.dayOfMonth, daysInMonth(ym)))}`;
  function recurringName(r) {
    if (r.note) return r.note;
    if (r.type === 'income') return r.isSalary ? 'Maaş' : 'Gelir';
    const c = r.categoryId && catMap().get(r.categoryId);
    return c ? c.name : 'Gider';
  }
  // Günü gelmiş ama eklenmemiş/atlanmamış tekrarlar (en fazla son 12 ay)
  function pendingRecurring() {
    const t = today(), cur = t.slice(0, 7), out = [];
    for (const r of state.recurring) {
      if (!r.active) continue;
      let ym = r.startMonth < addMonths(cur, -11) ? addMonths(cur, -11) : r.startMonth;
      for (; ym <= cur; ym = addMonths(ym, 1)) {
        const day = occurrenceDay(r, ym);
        if (day <= t && !r.handled[ym]) out.push({ r, ym, day });
      }
    }
    return out.sort((a, b) => (a.day < b.day ? -1 : a.day > b.day ? 1 : 0));
  }
  // Tekrarın ilk ayı: günü bu ay henüz gelmediyse bu ay, geçtiyse gelecek ay
  function firstMonthFor(dayOfMonth) {
    const t = today(), ym = t.slice(0, 7);
    return occurrenceDay({ dayOfMonth }, ym) >= t ? ym : addMonths(ym, 1);
  }
  function entryFromRecurring(r, day) {
    let method = r.method;
    if (method.startsWith('card:')) { const c = cardById(method.slice(5)); if (!c || c.archived) method = 'bank'; }
    return {
      id: newId(), type: r.type, amount: r.amount,
      categoryId: r.type === 'expense' ? r.categoryId : null,
      note: r.note, isSalary: r.type === 'income' && r.isSalary, method, system: null, day, createdAt: Date.now(),
    };
  }
  function applyRecurring(items, action) {
    const ids = new Set(items.map(x => x.r.id + '|' + x.ym));
    return commit(() => {
      for (const x of items) {
        if (action === 'added') state.entries.push(entryFromRecurring(x.r, x.day));
        if (action === 'added' && x.r.isSalary) state.period = null;
      }
      state.recurring = state.recurring.map(r => {
        const h = { ...r.handled };
        for (const x of items) if (x.r.id === r.id && ids.has(r.id + '|' + x.ym)) h[x.ym] = action;
        return { ...r, handled: h };
      });
    }, action === 'added' ? (items.length > 1 ? `${items.length} düzenli işlem eklendi` : 'Düzenli işlem eklendi') : 'Atlandı');
  }
  function recurringCard() {
    if (!canWrite()) return '';
    const items = pendingRecurring();
    if (!items.length) return '';
    return `<section class="card pending-card">
      <div class="card-head"><div><h2>Bekleyen düzenli işlemler</h2><p class="sub">Günü gelenleri ekle ya da bu sefer atla</p></div>
        ${items.length > 1 ? '<button class="link-btn" data-action="rec-add-all">Hepsini ekle</button>' : ''}</div>
      <div class="pending-list">${items.map(x => `<div class="pending-row">
        <span class="row-main"><span class="row-title">${esc(recurringName(x.r))}</span><span class="row-sub">${esc(dayName(x.day))} · ${esc(methodName(x.r.method))}</span></span>
        <span class="row-amt ${x.r.type === 'income' ? 'inc' : 'exp'}">${signed(x.r.amount, x.r.type)}</span>
        <span class="pending-actions">
          <button class="btn btn-quiet sm" data-action="rec-skip" data-id="${esc(x.r.id)}" data-month="${x.ym}">Atla</button>
          <button class="btn btn-primary sm" data-action="rec-add" data-id="${esc(x.r.id)}" data-month="${x.ym}">Ekle</button>
        </span>
      </div>`).join('')}</div>
    </section>`;
  }

  // ---------- Dönem sonu tahmini ----------
  // Açık dönem için: şimdiki net + (kalan gün × günlük ortalama gider) + henüz eklenmemiş düzenli işlemler.
  // Dönem uzunluğu bir önceki dönemin uzunluğu kabul edilir (yoksa 30 gün).
  function forecast(periods, p) {
    if (p.end !== null) return null;
    const elapsed = periodLength(p);
    if (elapsed < 2) return null;
    const prev = periods[p.index - 1];
    const expectedLen = prev && !prev.initial ? periodLength(prev) : 30;
    const remaining = Math.max(0, expectedLen - elapsed);
    const endDay = addDays(p.start, Math.max(expectedLen, elapsed) - 1);
    const pt = totals(state.entries.filter(e => inPeriod(e.day, p)));
    const avg = pt.exp / elapsed;
    let recurringNet = 0;
    for (const r of state.recurring) {
      if (!r.active || r.isSalary) continue;
      for (let ym = p.start.slice(0, 7); ym <= endDay.slice(0, 7); ym = addMonths(ym, 1)) {
        if (ym < r.startMonth || r.handled[ym]) continue;
        const day = occurrenceDay(r, ym);
        if (day < p.start || day > endDay) continue;
        // Günü geçmiş ama eklenmemiş olanlar da (bekleyenler) hesaba katılır
        recurringNet += r.type === 'income' ? r.amount : -r.amount;
      }
    }
    // Tahmin olduğu için tam liraya yuvarlanır
    const value = Math.round((pt.net - avg * remaining + recurringNet) / 100) * 100;
    return { value, endDay, remaining };
  }

  // ---------- Geçen dönemle karşılaştırma ----------
  function comparison(periods, p) {
    const prev = periods[p.index - 1];
    if (!prev) return null;
    // Açık dönem, geçen dönemin aynı sayıda günüyle karşılaştırılır
    const open = p.end === null;
    const span = periodLength(p);
    const prevEnd = open ? addDays(prev.start, span - 1) : prev.end;
    const inPrev = d => d >= prev.start && d <= (prevEnd < prev.end ? prevEnd : prev.end);
    const sum = (filter) => {
      const by = new Map();
      let total = 0;
      for (const e of state.entries) {
        if (e.type !== 'expense' || !filter(e.day)) continue;
        total += e.amount;
        if (e.system) continue;
        const key = e.categoryId && catMap().has(e.categoryId) ? e.categoryId : NONE;
        by.set(key, (by.get(key) || 0) + e.amount);
      }
      return { total, by };
    };
    const cur = sum(d => inPeriod(d, p)), old = sum(inPrev);
    if (!cur.total && !old.total) return null;
    const notes = [];
    const pctText = (a, b) => `%${Math.round(Math.abs(a - b) / b * 100)}`;
    if (old.total > 0) {
      const ch = cur.total - old.total;
      if (Math.abs(ch) / old.total >= 0.05) notes.push({ text: `Toplam gider ${pctText(cur.total, old.total)} ${ch > 0 ? 'arttı' : 'azaldı'} (${ch > 0 ? '+' : '−'}${money(Math.abs(ch))})`, up: ch > 0 });
      else notes.push({ text: 'Toplam gider hemen hemen aynı', up: null });
    }
    // Önemsiz küçük farklar gösterilmez: en az ₺200 ve en az %20 değişim
    const threshold = Math.max(20000, Math.round(old.total * 0.05));
    const map = catMap();
    const keys = new Set([...cur.by.keys(), ...old.by.keys()]);
    const movers = [];
    for (const k of keys) {
      const a = cur.by.get(k) || 0, b = old.by.get(k) || 0, d = a - b;
      if (Math.abs(d) < threshold) continue;
      if (b > 0 && Math.abs(d) / b < 0.2) continue;
      const name = k === NONE ? 'Kategorisiz' : map.get(k).name;
      const text = b === 0 ? `${name}: bu dönem yeni (${money(a)})` : a === 0 ? `${name}: bu dönem hiç yok (geçen dönem ${money(b)})` : `${name} ${pctText(a, b)} ${d > 0 ? 'arttı' : 'azaldı'} (${d > 0 ? '+' : '−'}${money(Math.abs(d))})`;
      movers.push({ text, up: d > 0, size: Math.abs(d) });
    }
    movers.sort((x, y) => y.size - x.size);
    return { notes: notes.concat(movers.slice(0, 3)), open };
  }
  function comparisonCard(periods, p) {
    const c = comparison(periods, p);
    if (!c || !c.notes.length) return '';
    return `<section class="card">
      <h2>Geçen dönemle karşılaştırma</h2>
      <p class="sub">${c.open ? 'Geçen dönemin aynı sayıda günüyle' : 'Bir önceki dönemle'} kıyaslandı</p>
      <ul class="compare-list">${c.notes.map(n => `<li class="${n.up === true ? 'up' : n.up === false ? 'down' : ''}"><span aria-hidden="true">${n.up === true ? '▲' : n.up === false ? '▼' : '='}</span>${esc(n.text)}</li>`).join('')}</ul>
    </section>`;
  }

  // ---------- Bütçe limitleri ----------
  function limitInfo(limit, spent) {
    const ratio = spent / limit;
    const level = ratio > 1 ? 'over' : ratio >= 0.8 ? 'near' : 'ok';
    const text = level === 'over' ? `Aşıldı: ${money(spent - limit)}` : level === 'near' ? `Sınıra yakın · %${Math.round(ratio * 100)}` : `%${Math.round(ratio * 100)}`;
    return { ratio, level, text };
  }
  function limitBar(limit, spent) {
    const li = limitInfo(limit, spent);
    return `<span class="limit-bar limit-${li.level}" role="img" aria-label="${esc(`${money(spent)} / ${money(limit)}, ${li.text}`)}"><i style="width:${Math.min(100, li.ratio * 100).toFixed(1)}%"></i></span>`;
  }
  function spentInPeriod(catId, p) {
    let sum = 0;
    for (const e of state.entries) if (e.type === 'expense' && !e.system && e.categoryId === catId && inPeriod(e.day, p)) sum += e.amount;
    return sum;
  }
  function budgetCard(p) {
    const rows = state.categories.filter(c => c.limit).map(c => ({ c, spent: spentInPeriod(c.id, p) }))
      .sort((a, b) => b.spent / b.c.limit - a.spent / a.c.limit);
    if (!rows.length) return '';
    return `<section class="card">
      <h2>Bütçe durumu</h2>
      <p class="sub">${esc(periodRange(p))} · limit koyduğun kategoriler</p>
      <div class="budget-list">${rows.map(({ c, spent }) => {
        const li = limitInfo(c.limit, spent);
        return `<button class="budget-row" data-action="open-category" data-id="${esc(c.id)}">
          <span class="budget-top"><span class="budget-name"><i class="dot" style="${catStyle(c.color)}"></i>${esc(c.name)}</span><span class="budget-amt">${money(spent)} / ${money(c.limit)}</span></span>
          ${limitBar(c.limit, spent)}
          <span class="budget-state state-${li.level}">${esc(li.text)}</span>
        </button>`;
      }).join('')}</div>
    </section>`;
  }

  // ---------- Parçalar ----------
  function transferRow(t) {
    const card = t.kind === 'cardpay' ? cardById(t.cardId) : null;
    const title = t.kind === 'cardpay' ? `${card ? card.name : 'Kart'} borç ödemesi` : TRANSFER_NAMES[t.kind];
    const route = t.kind === 'withdraw' ? 'Banka → Cüzdan' : t.kind === 'deposit' ? 'Cüzdan → Banka' : `${methodName(t.from)} → ${card ? card.name : 'Kart'}`;
    const tags = [route];
    if (t.note) tags.push(t.note);
    tags.push(dayName(t.day));
    return `<button class="row" data-action="open-transfer" data-id="${esc(t.id)}">
      <span class="avatar transfer" aria-hidden="true">${ICON.swap}</span>
      <span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(tags.join(' · '))}</span></span>
      <span class="row-amt transfer-amt">${money(t.amount)}</span>
    </button>`;
  }

  function swipeRow(x, map) {
    const kind = x.kind ? 'transfer' : 'entry';
    return `<div class="swipe">
      <button class="swipe-del" data-action="swipe-delete" data-kind="${kind}" data-id="${esc(x.id)}" tabindex="-1">${ICON.trash}Sil</button>
      ${entryRow(x, map)}
    </div>`;
  }

  function entryRow(e, map) {
    if (e.kind) return transferRow(e);
    const isInc = e.type === 'income';
    const c = catOf(e, map);
    const title = e.system ? SYSTEM_NAMES[e.system] : isInc ? (e.note || (e.isSalary ? 'Maaş' : 'Gelir')) : (c ? c.name : 'Kategorisiz');
    const tags = [];
    if (isInc && e.isSalary) tags.push('Maaş · dönem başı');
    if ((!isInc || e.system) && e.note) tags.push(e.note);
    if (e.method !== 'bank' || state.cards.length || walletUsed()) tags.push(methodName(e.method));
    tags.push(dayName(e.day));
    const avatar = e.system
      ? `<span class="avatar transfer" aria-hidden="true">±</span>`
      : isInc
      ? `<span class="avatar income" aria-hidden="true">${ICON.plus}</span>`
      : `<span class="avatar" style="${catStyle(c ? c.color : null)}" aria-hidden="true">${esc(initial(title))}</span>`;
    return `<button class="row" data-action="open-entry" data-id="${esc(e.id)}">
      ${avatar}
      <span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(tags.join(' · '))}</span></span>
      <span class="row-amt ${isInc ? 'inc' : 'exp'}">${signed(e.amount, e.type)}</span>
    </button>`;
  }

  // Kayıtları maaş dönemlerine göre gruplar (en yeni dönem üstte)
  function groupedList(list, map) {
    const periods = getPeriods();
    const groups = [];
    let cur = null;
    for (const e of list) {
      const p = periodOfDay(e.day, periods);
      if (!cur || cur.period !== p) { cur = { period: p, items: [] }; groups.push(cur); }
      cur.items.push(e);
    }
    return groups.map(g => {
      const t = totals(g.items);
      return `<section class="group">
        <div class="group-head"><h3>${esc(periodTitle(g.period))} <span class="group-range">${esc(periodRange(g.period))}</span></h3>
          <p>${t.inc ? `<span class="inc">+${money(t.inc)}</span>` : ''}${t.exp ? `<span class="exp">−${money(t.exp)}</span>` : ''}</p>
        </div>
        <div class="card flush list">${g.items.map(e => canWrite() ? swipeRow(e, map) : entryRow(e, map)).join('')}</div>
      </section>`;
    }).join('');
  }

  function statusNotice() {
    if (!state.storageOk) {
      return '<p class="notice">Bu tarayıcı kayıt saklamaya izin vermiyor (gizli sekme açık olabilir). Normal bir sekmede ya da ana ekrandaki simgeden aç.</p>';
    }
    return '';
  }
  function installNotice() {
    if (!isIOS || isStandalone) return '';
    return `<p class="notice"><b>Ana ekrana ekle:</b> Safari'de alttaki Paylaş düğmesine, sonra "Ana Ekrana Ekle"ye dokun ve uygulamayı hep o simgeden aç. Ana ekran uygulaması kayıtlarını Safari'den ayrı tutar; kayıt girmeye eklemeden sonra başla.</p>`;
  }

  // ---------- Görünümler ----------
  function renderHome() {
    const map = catMap();
    let html = statusNotice() + installNotice() + backupNotice() + dueNotices();
    html += heroCard();
    html += recurringCard();

    if (!state.entries.length) {
      html += `<section class="card">
        <h2>Nasıl kullanılır?</h2>
        <ol class="steps">
          <li><b>Gelir ekle</b> ile maaşını gir ve <b>Maaş</b> kutusunu işaretli bırak; yeni dönemin o gün başlar.</li>
          <li>Her harcamanı <b>Gider/Harcama ekle</b> ile kategorisini seçerek gir.</li>
          <li>Kendi kategorilerini <b>Kategoriler</b> sekmesinden oluşturabilirsin.</li>
          <li>Kayıt girdikçe burada, paranın nereye gittiğini grafiklerle göreceksin.</li>
        </ol>
        <p class="sub" style="margin-top:12px">Kayıtların sadece bu cihazda durur ve internet olmadan da çalışır. Ara sıra sağ üstteki <b>Yedek</b> ile yedek al.</p>
      </section>`;
      return html;
    }

    const periods = getPeriods();
    const p = selectedPeriod(periods);
    const pt = totals(state.entries.filter(e => inPeriod(e.day, p)));
    const hasPrev = p.index > 0, hasNext = p.index < periods.length - 1;
    html += `<section class="card">
      <div class="month-nav">
        <button class="icon-btn" data-action="period-prev" aria-label="Önceki dönem"${hasPrev ? '' : ' disabled'}>${ICON.left}</button>
        <div class="period-head"><h2>${esc(periodTitle(p))}</h2><p class="sub">${esc(periodRange(p))}${p.end === null ? ` · ${periodLength(p)}. gün` : ''}</p></div>
        <button class="icon-btn" data-action="period-next" aria-label="Sonraki dönem"${hasNext ? '' : ' disabled'}>${ICON.right}</button>
      </div>
      <dl class="stats">
        <div><dt>Gelir</dt><dd class="inc">+${money(pt.inc)}</dd></div>
        <div><dt>Gider</dt><dd class="exp">−${money(pt.exp)}</dd></div>
        <div><dt>Kalan</dt><dd class="${pt.net < 0 ? 'neg' : ''}">${money(pt.net)}</dd></div>
      </dl>
      ${methodSplit(p)}
      ${(() => {
        const f = forecast(periods, p);
        return f ? `<p class="forecast${f.value < 0 ? ' neg' : ''}">Bu hızla dönem sonunda (≈ ${esc(shortDay(f.endDay))}) yaklaşık <b>${money(f.value)}</b> kalacak</p>` : '';
      })()}
    </section>`;
    html += budgetCard(p);
    html += comparisonCard(periods, p);

    const { total, slices } = expenseSlices(p, map);
    donutSlices = slices;
    donutTotal = total;
    html += `<section class="card">
      <h2>Paran nereye gitti?</h2>
      <p class="sub">${esc(periodRange(p))} harcamalarının kategorilere dağılımı</p>
      ${slices.length ? donut(slices, total) : '<p class="empty">Bu dönemde henüz harcama girilmemiş.</p>'}
    </section>`;

    const bars = periodBars(periods, p);
    const max = Math.max(1, ...bars.map(b => Math.max(b.inc, b.exp)));
    const sel = bars.find(b => b.period === p);
    html += `<section class="card">
      <h2>Dönemlere göre gelir ve gider</h2>
      <p class="sub">Bir döneme dokunarak o dönemin detayını görebilirsin</p>
      <div class="bars" role="group" aria-label="Son dönemlerin gelir ve gideri">
        ${bars.map(b => {
          const label = `${periodRange(b.period)}: gelir ${money(b.inc)}, gider ${money(b.exp)}`;
          return `<button class="bar-col${b.period === p ? ' sel' : ''}" data-action="select-period" data-period="${esc(b.period.key)}" aria-label="${esc(label)}" title="${esc(label)}">
            <span class="bar-pair">
              <span class="bar b-inc" style="height:${b.inc ? `max(2px, ${(b.inc / max * 100).toFixed(2)}%)` : '0'}"></span>
              <span class="bar b-exp" style="height:${b.exp ? `max(2px, ${(b.exp / max * 100).toFixed(2)}%)` : '0'}"></span>
            </span>
            <span class="bar-label">${esc(b.period.initial ? 'Başl.' : shortDayFmt.format(parseDay(b.period.start)))}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="chart-foot">
        <span class="legend-inline"><span><i style="background:var(--income)"></i>Gelir</span><span><i style="background:var(--expense)"></i>Gider</span></span>
        <span>Ölçek: en yüksek ${compact(max)}</span>
      </div>
      ${sel ? `<p class="readout"><b>${esc(periodRange(sel.period))}</b> · <span class="inc">+${money(sel.inc)}</span> · <span class="exp">−${money(sel.exp)}</span></p>` : ''}
    </section>`;

    html += `<section class="card flush">
      <div class="card-head"><div><h2>Son işlemler</h2></div><button class="link-btn" data-action="tab" data-view="entries">Tümünü gör</button></div>
      <div class="list">${state.entries.slice(0, 5).map(e => canWrite() ? swipeRow(e, map) : entryRow(e, map)).join('')}</div>
    </section>`;
    return html;
  }

  function heroCard() {
    const b = accountBalances();
    const wallet = walletUsed();
    const statuses = activeCards().map(cardStatus).concat(state.cards.filter(c => c.archived).map(cardStatus).filter(st => st.total > 0));
    const dueTotal = statuses.reduce((sum, st) => sum + st.statementDue, 0);
    const pendingTotal = statuses.reduce((sum, st) => sum + Math.max(0, st.newStatement), 0);
    const after = b.cash - dueTotal;
    const lines = [];
    if (wallet) lines.push(['Banka', money(b.bank)], ['Cüzdan', money(b.wallet)]);
    return `<section class="hero" aria-label="Bakiye">
      <p class="hero-label">Toplam nakit</p>
      <p class="hero-amount${b.cash < 0 ? ' neg' : ''}">${money(b.cash)}</p>
      ${b.cash < 0 ? '<p class="hero-warn">Nakit eksiye düştü</p>' : ''}
      ${lines.length ? `<dl class="hero-lines">${lines.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
      ${statuses.length ? `<div class="hero-cards">
        ${statuses.map(st => `<button class="hero-card-row" data-action="open-card" data-id="${esc(st.card.id)}">
          <span class="hc-name">${ICON.card}${esc(st.card.name)}</span>
          <span class="hc-vals"><span>Kesilen <b>${money(st.statementDue)}</b>${st.statementDue ? ` · son ödeme ${esc(shortDay(st.due))}` : ''}</span><span>Yeni ekstre <b>${money(Math.max(0, st.newStatement))}</b></span></span>
        </button>`).join('')}
        <dl class="hero-lines hero-sum">
          <div><dt>Ödenecek ekstreler</dt><dd>${money(dueTotal)}</dd></div>
          <div class="${after < 0 ? 'neg-line' : ''}"><dt>Borç ödenince kalacak</dt><dd>${money(after)}</dd></div>
        </dl>
        ${after < 0 ? '<p class="hero-warn">Nakdin kesilen ekstreleri ödemeye yetmiyor</p>' : ''}
        ${pendingTotal ? `<p class="hero-note">Henüz kesilmemiş kart harcamaları: ${money(pendingTotal)} (sonraki ekstrelere yazılacak)</p>` : ''}
      </div>` : ''}
      ${canWrite() ? `<div class="hero-actions">
        <button class="btn btn-income" data-action="add-income">${ICON.plus}Gelir ekle</button>
        <button class="btn btn-expense" data-action="add-expense">${ICON.minus}Gider/Harcama ekle</button>
      </div>
      <div class="hero-links">
        <button class="hero-link" data-action="transfer-new">${ICON.swap}Para çek / yatır</button>
        ${activeCards().length ? `<button class="hero-link" data-action="card-pay">${ICON.card}Kart borcu öde</button>` : ''}
        ${wallet ? `<button class="hero-link" data-action="wallet-count">Cüzdanı say</button>` : ''}
      </div>` : ''}
    </section>`;
  }

  // Dönemdeki giderlerin ödeme yöntemine göre dağılımı (birden fazla yöntem varsa)
  function methodSplit(p) {
    const by = new Map();
    for (const e of state.entries) {
      if (e.type !== 'expense' || !inPeriod(e.day, p)) continue;
      by.set(e.method, (by.get(e.method) || 0) + e.amount);
    }
    if (by.size < 2) return '';
    const parts = [...by].sort((a, b) => b[1] - a[1]).map(([m, v]) => `${esc(methodName(m))} <b>${money(v)}</b>`);
    return `<p class="method-split">Giderler: ${parts.join(' · ')}</p>`;
  }

  // 30 gündür (ya da hiç) yedek alınmadıysa hatırlat; kapatılırsa 7 gün sonra tekrar
  function backupNotice() {
    if (!canWrite()) return '';
    let last = 0, snooze = 0;
    try { last = Number(localStorage.getItem(BACKUP_KEY)) || 0; snooze = Number(localStorage.getItem(SNOOZE_KEY)) || 0; } catch (e) { return ''; }
    const now = Date.now(), DAY = 86400000;
    if (snooze > now) return '';
    const records = state.entries.length + state.transfers.length;
    let text;
    if (last) {
      const days = Math.floor((now - last) / DAY);
      if (days < 30) return '';
      text = `${days} gündür yedek almadın.`;
    } else {
      if (records < 10) return '';
      text = 'Henüz hiç yedek almadın.';
    }
    return `<div class="notice notice-backup"><span><b>${text}</b> Kayıtların sadece bu telefonda duruyor.</span>
      <span class="notice-actions"><button class="link-btn" data-action="backup">Şimdi yedekle</button>
      <button class="icon-btn" data-action="backup-snooze" aria-label="Hatırlatmayı kapat">${ICON.close}</button></span></div>`;
  }

  // Son ödeme günü yaklaşan (3 gün kala) ya da geçen ekstreler
  function dueNotices() {
    const t = today();
    return state.cards.map(cardStatus).filter(st => st.statementDue > 0).map(st => {
      const left = daysBetween(t, st.due);
      if (left > 3) return '';
      const when = left < 0 ? `son ödeme günü geçti (${shortDay(st.due)})` : left === 0 ? 'son ödeme günü bugün' : `son ödeme günü ${left} gün sonra (${shortDay(st.due)})`;
      return `<div class="notice notice-warn"><span><b>${esc(st.card.name)}</b> ekstresi: ${money(st.statementDue)}, ${when}.</span>
        ${canWrite() ? `<button class="link-btn" data-action="card-pay" data-id="${esc(st.card.id)}">Öde</button>` : ''}</div>`;
    }).join('');
  }

  function donut(slices, total) {
    const R = 78, SW = 26, C = 2 * Math.PI * R;
    const gap = slices.length > 1 ? 2.4 : 0;
    let offset = 0;
    const circles = slices.map((s, i) => {
      const len = s.fraction * C;
      const dash = Math.max(len - gap, 0.01);
      const el = `<circle class="slice" data-slice="${i}" cx="100" cy="100" r="${R}" fill="none" stroke-width="${SW}"
        style="stroke:${colorVar(s.color)}" stroke-dasharray="${dash.toFixed(3)} ${C.toFixed(3)}"
        stroke-dashoffset="${(-(offset + gap / 2)).toFixed(3)}" transform="rotate(-90 100 100)"><title>${esc(s.name)}: ${money(s.amount)}</title></circle>`;
      offset += len;
      return el;
    }).join('');
    const legend = slices.map((s, i) => {
      const inner = `<i class="dot"></i><span class="legend-name">${esc(s.name)}</span><span class="legend-pct">${pctFmt.format(s.fraction)}</span><span class="legend-amt">${money(s.amount)}</span>`;
      return s.folded || s.system
        ? `<div class="legend-row" data-slice="${i}" style="${catStyle(s.color)}">${inner}</div>`
        : `<button class="legend-row" data-slice="${i}" data-action="open-category" data-id="${esc(s.key)}" style="${catStyle(s.color)}">${inner}</button>`;
    }).join('');
    return `<div class="donut-wrap">
        <svg viewBox="0 0 200 200" role="img" aria-label="Kategorilere göre harcama dağılımı">${circles}</svg>
        <div class="donut-center"><span id="dc-label">Toplam gider</span><span id="dc-value">${money(total)}</span></div>
      </div>
      <div class="legend-list">${legend}</div>`;
  }

  function setDonutFocus(i) {
    const label = $('#dc-label'), value = $('#dc-value');
    if (!label || !value) return;
    const s = i === null ? null : donutSlices[i];
    label.textContent = s ? s.name : 'Toplam gider';
    value.textContent = money(s ? s.amount : donutTotal);
    document.querySelectorAll('[data-slice]').forEach(el => el.classList.toggle('active', s !== null && Number(el.dataset.slice) === i));
  }

  // Gelir/gider kayıtları ve transferler tarih sırasıyla tek listede
  const allItems = () => state.entries.concat(state.transfers).sort(byDate);

  // ---------- Arama ve filtre ----------
  const RANGES = [
    ['all', 'Tüm zamanlar'], ['period', 'Bu dönem'], ['prevperiod', 'Geçen dönem'], ['month', 'Bu ay'],
    ['prevmonth', 'Geçen ay'], ['3months', 'Son 3 ay'], ['year', 'Bu yıl'], ['custom', 'Özel aralık'],
  ];
  function rangeBounds() {
    const t = today(), ym = t.slice(0, 7);
    switch (state.range) {
      case 'period': { const p = currentPeriod(getPeriods()); return [p.start, null]; }
      case 'prevperiod': { const ps = getPeriods(); const p = ps[ps.length - 2]; return p ? [p.start, p.end] : ['9999-12-31', null]; }
      case 'month': return [ym + '-01', null];
      case 'prevmonth': { const m = addMonths(ym, -1); return [m + '-01', `${m}-${pad(daysInMonth(m))}`]; }
      case '3months': return [addDays(t, -90), null];
      case 'year': return [t.slice(0, 4) + '-01-01', null];
      case 'custom': return [state.from || '0000-01-01', state.to || null];
      default: return [null, null];
    }
  }
  const normalize = v => String(v || '').toLocaleLowerCase(TR);
  function itemText(x, map) {
    if (x.kind) {
      const card = x.kind === 'cardpay' ? cardById(x.cardId) : null;
      return [TRANSFER_NAMES[x.kind], card && card.name, x.note, 'transfer'].join(' ');
    }
    const c = catOf(x, map);
    return [x.note, c ? c.name : x.type === 'expense' && !x.system ? 'Kategorisiz' : '', x.system && SYSTEM_NAMES[x.system],
      methodName(x.method), x.type === 'income' ? 'gelir' : 'gider', x.isSalary ? 'maaş' : ''].join(' ');
  }
  function filteredItems() {
    const map = catMap();
    const [from, to] = rangeBounds();
    const q = normalize(state.q).trim();
    const qAmount = /^[\d.,]+$/.test(q) ? q.replace(/\./g, '').replace(/,$/, '') : null;
    return allItems().filter(x => {
      if (state.filter === 'transfer' ? !x.kind : state.filter !== 'all' && x.type !== state.filter) return false;
      if (from && x.day < from) return false;
      if (to && x.day > to) return false;
      if (state.catFilter) {
        if (x.kind || x.type !== 'expense' || x.system) return false;
        const c = catOf(x, map);
        if (state.catFilter === NONE ? c : !c || c.id !== state.catFilter) return false;
      }
      if (q) {
        const amountHit = qAmount !== null && amountToInput(x.amount).startsWith(qAmount);
        if (!amountHit && !normalize(itemText(x, map)).includes(q)) return false;
      }
      return true;
    });
  }
  function entriesResults() {
    const list = filteredItems();
    const any = allItems().length;
    if (!list.length) {
      return `<p class="empty">${any ? 'Bu aramaya / filtreye uyan kayıt yok.' : 'Henüz hiç işlem yok. Sağ alttaki Ekle ile ilk kaydını gir.'}</p>`;
    }
    const t = totals(list);
    const tr = list.filter(x => x.kind).length;
    return `<p class="result-sum"><b>${list.length}</b> kayıt${t.inc ? ` · <span class="inc">+${money(t.inc)}</span>` : ''}${t.exp ? ` · <span class="exp">−${money(t.exp)}</span>` : ''}${tr ? ` · ${tr} transfer` : ''}</p>` + groupedList(list, catMap());
  }
  const filtersActive = () => !!(state.q || state.range !== 'all' || state.catFilter);

  function renderEntries() {
    const chip = (key, label) => `<button class="chip" data-action="filter" data-filter="${key}" aria-pressed="${state.filter === key}">${label}</button>`;
    const catOpts = [['', 'Tüm kategoriler']].concat(state.categories.map(c => [c.id, c.name]), [[NONE, 'Kategorisiz']]);
    let html = statusNotice();
    html += `<div class="filters">
      <label class="search"><span class="visually-hidden">Ara</span>
        <input type="search" id="q" placeholder="Ara: not, kategori, tutar…" autocomplete="off" value="${esc(state.q)}">
      </label>
      <div class="chips">${chip('all', 'Tümü')}${chip('income', 'Gelirler')}${chip('expense', 'Giderler')}${state.transfers.length ? chip('transfer', 'Transferler') : ''}</div>
      <div class="filter-row">
        <label class="select"><span class="visually-hidden">Tarih aralığı</span><select id="range">${RANGES.map(([k, l]) => `<option value="${k}"${k === state.range ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="select"><span class="visually-hidden">Kategori</span><select id="catf">${catOpts.map(([k, l]) => `<option value="${esc(k)}"${k === state.catFilter ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
      </div>
      <div class="filter-row" id="custom-range"${state.range === 'custom' ? '' : ' hidden'}>
        <label class="field"><span>Başlangıç</span><input type="date" id="from" value="${esc(state.from)}"></label>
        <label class="field"><span>Bitiş</span><input type="date" id="to" value="${esc(state.to)}"></label>
      </div>
      ${filtersActive() ? '<button class="link-btn" data-action="clear-filters">Filtreleri temizle</button>' : ''}
    </div>
    <div id="entries-results">${entriesResults()}</div>`;
    return html;
  }
  // Arama yazılırken sadece sonuçlar yenilenir (klavye kapanmasın)
  function refreshResults() {
    const box = $('#entries-results');
    if (box) box.innerHTML = entriesResults();
  }

  // Kategori başına: içinde bulunulan (açık) dönemdeki toplam ve tüm zamanlardaki harcama adedi
  function categoryStats(map) {
    const cur = currentPeriod(getPeriods());
    const stats = new Map();
    for (const e of state.entries) {
      if (e.type !== 'expense' || e.system) continue;
      const c = catOf(e, map);
      const key = c ? c.id : NONE;
      const s = stats.get(key) || { period: 0, count: 0 };
      if (inPeriod(e.day, cur)) s.period += e.amount;
      s.count += 1;
      stats.set(key, s);
    }
    return stats;
  }

  function renderCategories() {
    const map = catMap();
    const stats = categoryStats(map);
    let html = statusNotice();
    html += '<p class="hint">Harcamalarını sınıflandırmak için kendi kategorilerini oluştur. Bir kategoriye dokunarak içindeki harcamaları görebilirsin.</p>';
    if (canWrite()) html += `<button class="btn btn-primary btn-block" data-action="new-category">${ICON.plus}Yeni kategori</button>`;
    const rows = state.categories.map(c => {
      const s = stats.get(c.id) || { period: 0, count: 0 };
      return `<div class="cat-row">
        <button class="row-hit" data-action="open-category" data-id="${esc(c.id)}">
          <span class="avatar" style="${catStyle(c.color)}" aria-hidden="true">${esc(initial(c.name))}</span>
          <span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">${c.limit ? `Bu dönem ${money(s.period)} / ${money(c.limit)} · ${esc(limitInfo(c.limit, s.period).text)}` : `Bu dönem ${money(s.period)} · ${s.count} harcama`}</span>${c.limit ? limitBar(c.limit, s.period) : ''}</span>
        </button>
        ${canWrite() ? `<button class="icon-btn" data-action="edit-category" data-id="${esc(c.id)}" aria-label="${esc(c.name)} kategorisini düzenle">${ICON.edit}</button>
        <button class="icon-btn" data-action="delete-category" data-id="${esc(c.id)}" aria-label="${esc(c.name)} kategorisini sil">${ICON.trash}</button>` : ''}
      </div>`;
    });
    const none = stats.get(NONE);
    if (none) {
      rows.push(`<div class="cat-row">
        <button class="row-hit" data-action="open-category" data-id="${NONE}">
          <span class="avatar" style="${catStyle(null)}" aria-hidden="true">K</span>
          <span class="row-main"><span class="row-title">Kategorisiz</span><span class="row-sub">Bu dönem ${money(none.period)} · ${none.count} harcama · silinen kategorilerden kalanlar</span></span>
        </button>
      </div>`);
    }
    html += rows.length
      ? `<div class="card flush list">${rows.join('')}</div>`
      : '<p class="empty">Henüz kategori yok.</p>';
    html += cardsSection();
    html += recurringSection();
    return html;
  }

  function recurringSection() {
    let html = `<section class="group" style="margin-top:8px">
      <div class="group-head"><h3>Düzenli işlemler</h3></div>
      <p class="hint">Maaş, kira, fatura, abonelik gibi her ay tekrarlananları bir kez tanımla; günü gelince ana sayfada eklemek için sorulur.</p>`;
    if (state.recurring.length) {
      html += `<div class="card flush list">${state.recurring.slice().sort((a, b) => a.dayOfMonth - b.dayOfMonth).map(r => `
        <button class="row" data-action="rec-edit" data-id="${esc(r.id)}">
          <span class="avatar ${r.type === 'income' ? 'income' : 'transfer'}" aria-hidden="true">${ICON.repeat}</span>
          <span class="row-main"><span class="row-title">${esc(recurringName(r))}${r.active ? '' : ' (durduruldu)'}</span><span class="row-sub">Her ayın ${r.dayOfMonth}. günü · ${esc(methodName(r.method))}${r.isSalary ? ' · maaş' : ''}</span></span>
          <span class="row-amt ${r.type === 'income' ? 'inc' : 'exp'}">${signed(r.amount, r.type)}</span>
        </button>`).join('')}</div>`;
    }
    if (canWrite()) html += `<button class="btn btn-quiet btn-block" data-action="rec-new">${ICON.plus}Düzenli işlem ekle</button>`;
    return html + '</section>';
  }

  function cardsSection() {
    let html = `<section class="group" style="margin-top:8px">
      <div class="group-head"><h3>Kredi kartları</h3></div>
      <p class="hint">Kartla yaptığın harcamalar grafiklerde görünür ama nakdinden düşmez; borç olarak izlenir. Kesim gününe göre ekstreler ayrı hesaplanır.</p>`;
    const cards = activeCards();
    if (cards.length) {
      html += `<div class="card flush list">${cards.map(c => {
        const st = cardStatus(c);
        return `<button class="row" data-action="open-card" data-id="${esc(c.id)}">
          <span class="avatar transfer" aria-hidden="true">${ICON.card}</span>
          <span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">Kesim ${c.cutDay} · son ödeme ${c.dueDay} · borç ${money(Math.max(0, st.total))}</span></span>
        </button>`;
      }).join('')}</div>`;
    }
    if (canWrite()) html += `<button class="btn btn-quiet btn-block" data-action="card-new">${ICON.plus}Kart ekle</button>`;
    return html + '</section>';
  }

  function detailInfo() {
    const map = catMap();
    const id = state.detailCat;
    const cat = id && id !== NONE ? map.get(id) || null : null;
    const name = cat ? cat.name : id === NONE ? 'Kategorisiz' : 'Kategori';
    return { map, id, cat, name };
  }

  function renderCategoryDetail() {
    const { map, id, cat, name } = detailInfo();
    if (id !== NONE && !cat) return '<p class="empty">Bu kategori silinmiş.</p>';
    const list = state.entries.filter(e => {
      if (e.type !== 'expense' || e.system) return false;
      const c = catOf(e, map);
      return id === NONE ? !c : c && c.id === id;
    });
    const cur = currentPeriod(getPeriods());
    const periodSum = list.filter(e => inPeriod(e.day, cur)).reduce((s, e) => s + e.amount, 0);
    const total = list.reduce((s, e) => s + e.amount, 0);
    let html = `<section class="card summary">
      <span class="avatar lg" style="${catStyle(cat ? cat.color : null)}" aria-hidden="true">${esc(initial(name))}</span>
      <div class="summary-main"><p class="big exp">Bu dönem ${money(periodSum)}</p>
        ${cat && cat.limit ? `<p class="small">Limit ${money(cat.limit)} · ${esc(limitInfo(cat.limit, periodSum).text)}</p>${limitBar(cat.limit, periodSum)}` : ''}
        <p class="small">Toplam ${money(total)} · ${list.length} harcama</p></div>
    </section>`;
    html += list.length ? groupedList(list, map) : '<p class="empty">Bu kategoride henüz harcama yok.</p>';
    return html;
  }

  function render() {
    const v = state.view;
    const titles = { home: 'Bütçem', entries: 'İşlemler', categories: 'Kategoriler' };
    $('#view-title').textContent = v === 'category' ? detailInfo().name : titles[v];
    $('#back').hidden = v !== 'category';
    $('#backup-btn').hidden = v === 'category';
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.view === (v === 'category' ? state.prevView : v);
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    $('#view').innerHTML = v === 'home' ? renderHome()
      : v === 'entries' ? renderEntries()
      : v === 'categories' ? renderCategories()
      : renderCategoryDetail();

    const fab = $('#fab');
    const detail = v === 'category' ? detailInfo() : null;
    fab.hidden = !canWrite() || !(v === 'entries' || (detail && detail.cat));
    $('#fab-label').textContent = v === 'category' ? 'Gider/Harcama ekle' : 'Ekle';
  }

  function go(view) {
    if (view === state.view) return;
    state.view = view;
    state.detailCat = null;
    render();
    window.scrollTo(0, 0);
  }

  let toastTimer = 0;
  let toastAction = null;
  function toast(msg, action = null) {
    const el = $('#toast');
    toastAction = action;
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="toast-btn" data-action="toast-action">${esc(action.label)}</button>` : ''}`;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; toastAction = null; }, action ? action.ms || 5000 : 3200);
  }

  // Kaydı siler ve birkaç saniye "Geri al" imkânı verir
  function deleteWithUndo(kind, id) {
    const coll = kind === 'transfer' ? 'transfers' : 'entries';
    const item = state[coll].find(x => x.id === id);
    if (!item) return false;
    if (!commit(() => { state[coll] = state[coll].filter(x => x.id !== id); })) return false;
    toast(kind === 'transfer' ? 'Transfer silindi' : 'Kayıt silindi', {
      label: 'Geri al', ms: 5000,
      run: () => { if (!state[coll].some(x => x.id === id)) commit(() => { state[coll].push(item); }, 'Geri alındı'); },
    });
    return true;
  }

  function nameError(name, exceptId) {
    if (!name) return 'Kategoriye bir ad ver.';
    const low = name.toLocaleLowerCase(TR);
    if (state.categories.some(c => c.id !== exceptId && c.name.toLocaleLowerCase(TR) === low)) return 'Bu isimde bir kategori zaten var.';
    return null;
  }
  function suggestColor() {
    const used = new Set(state.categories.map(c => c.color));
    for (let i = 0; i < PALETTE_SIZE; i++) if (!used.has(i)) return i;
    return state.categories.length % PALETTE_SIZE;
  }
  function swatches(selected, action) {
    return Array.from({ length: PALETTE_SIZE }, (_, i) =>
      `<button type="button" class="swatch" data-action="${action}" data-color="${i}" aria-pressed="${i === selected}" aria-label="Renk ${i + 1}" style="${catStyle(i)}">${ICON.check}</button>`
    ).join('');
  }
  function markSwatches(container, selected) {
    container.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.color) === selected)));
  }

  // ---------- Alttan açılan pencereler ----------
  function openSheet(html, ctx) {
    lastFocus = document.activeElement;
    const root = $('#sheet-root');
    root.innerHTML = `<div class="sheet-backdrop" data-action="sheet-close"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div>${html}</div>`;
    root.hidden = false;
    document.documentElement.classList.add('locked');
    sheet = ctx;
  }
  function closeSheet() {
    const root = $('#sheet-root');
    root.hidden = true;
    root.innerHTML = '';
    sheet = null;
    document.documentElement.classList.remove('locked');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  const sheetHead = title => `<header class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2>
    <button type="button" class="icon-btn" data-action="sheet-close" aria-label="Kapat">${ICON.close}</button></header>`;

  // Gelir / harcama formu
  function openEntrySheet({ id = null, type = 'expense', categoryId = null } = {}) {
    if (!canWrite()) return;
    const existing = id ? state.entries.find(e => e.id === id) : null;
    if (id && !existing) { toast('Bu kayıt bulunamadı.'); return; }
    const ctx = {
      kind: 'entry',
      id: existing ? existing.id : null,
      type: existing ? existing.type : type,
      categoryId: existing ? existing.categoryId : categoryId,
      method: existing ? existing.method : preferredMethod(existing ? existing.type : type),
      system: existing ? existing.system : null,
      createdAt: existing ? existing.createdAt : 0,
      ncColor: suggestColor(),
    };
    const html = sheetHead(existing ? 'İşlemi düzenle' : '') + `
      <form class="form" id="entry-form" novalidate>
        <div class="seg" role="radiogroup" aria-label="Kayıt türü">
          <button type="button" role="radio" data-action="form-type" data-type="income">Gelir</button>
          <button type="button" role="radio" data-action="form-type" data-type="expense">Gider/Harcama</button>
        </div>
        <div class="field" id="recent-section" hidden><span class="field-label">Son kullanılanlar</span><div class="chips" id="f-recent"></div></div>
        <label class="field"><span>Tutar</span>
          <span class="amount-wrap"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-describedby="err-amount"><span class="suffix">₺</span></span>
          <small class="err" id="err-amount" hidden>Geçerli bir tutar gir (ör. 250 ya da 99,90).</small>
        </label>
        <div class="field" id="cat-section">
          <span class="field-label">Kategori</span>
          <div class="chips" id="f-chips"></div>
          <div class="newcat" id="newcat" hidden>
            <label class="field"><span>Yeni kategori adı</span><input id="nc-name" maxlength="30" autocomplete="off" placeholder="ör. Kahve, Spor, Evcil hayvan"></label>
            <div class="swatches" id="nc-swatches">${swatches(ctx.ncColor, 'nc-color')}</div>
            <small class="err" id="nc-err" hidden></small>
            <div class="actions"><button type="button" class="btn btn-quiet" data-action="nc-cancel">Vazgeç</button><button type="button" class="btn btn-primary" data-action="nc-save">Kategoriyi ekle</button></div>
          </div>
          <small class="err" id="err-cat" hidden>Harcamanın hangi kategoriye ait olduğunu seç.</small>
        </div>
        <div class="field" id="method-section"><span class="field-label" id="method-label">Nasıl ödendi?</span><div class="chips" id="f-methods"></div></div>
        <label class="field"><span id="note-label">Not (isteğe bağlı)</span><input id="f-note" maxlength="80" autocomplete="off"></label>
        <label class="check" id="salary-row"><input type="checkbox" id="f-salary"><span>Maaş <small>Bu gelir yeni dönemi başlatır</small></span></label>
        <label class="field"><span>Tarih</span><input id="f-day" type="date" required aria-describedby="err-day"><small class="err" id="err-day" hidden>Bir tarih seç.</small></label>
        <div id="entry-actions" class="actions">
          ${existing ? `<button type="button" class="btn btn-outline-danger" data-action="entry-delete">${ICON.trash}Sil</button>` : ''}
          <button type="submit" class="btn btn-primary" id="f-save">Kaydet</button>
        </div>
      </form>`;
    openSheet(html, ctx);
    $('#f-amount').value = existing ? amountToInput(existing.amount) : '';
    $('#f-note').value = existing ? existing.note : '';
    $('#f-salary').checked = existing ? existing.isSalary : false;
    ctx.salaryTouched = !!existing;
    $('#f-day').value = existing ? existing.day : today();
    applyEntryType();
    renderChips();
    if (!existing) $('#f-amount').focus();
    else $('#sheet-root .sheet-head .icon-btn').focus({ preventScroll: true });
  }

  function applyEntryType() {
    if (!sheet || sheet.kind !== 'entry') return;
    const inc = sheet.type === 'income';
    document.querySelectorAll('.seg [data-type]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.type === sheet.type)));
    $('#cat-section').hidden = inc || !!sheet.system;
    $('#salary-row').hidden = !inc || !!sheet.system;
    // Cüzdan farkı / kart düzeltmesi: tür ve ödeme yöntemi değiştirilemez
    $('#entry-form .seg').hidden = !!sheet.system;
    $('#method-section').hidden = !!sheet.system;
    if (sheet.system) $('#sheet-title').textContent = SYSTEM_NAMES[sheet.system];
    if (!sheet.system && !methodOptions(sheet.type).includes(sheet.method) && !(sheet.id && sheet.method.startsWith('card:') && sheet.type === 'expense')) sheet.method = preferredMethod(sheet.type);
    $('#method-label').textContent = inc ? 'Hangi hesaba geldi?' : 'Nasıl ödendi?';
    renderMethods();
    renderRecent();
    $('#note-label').textContent = inc ? 'Açıklama (ör. Maaş, Kira geliri)' : 'Not (isteğe bağlı)';
    if (!sheet.id) $('#sheet-title').textContent = inc ? 'Gelir ekle' : 'Gider/Harcama ekle';
  }

  function renderMethods() {
    const wrap = $('#f-methods');
    if (!wrap || !sheet || sheet.kind !== 'entry') return;
    const opts = methodOptions(sheet.type);
    // Düzenlenen kaydın kartı arşivlendiyse yine de seçili görünsün
    if (!opts.includes(sheet.method)) opts.push(sheet.method);
    wrap.innerHTML = opts.map(m =>
      `<button type="button" class="chip" data-action="pick-method" data-method="${esc(m)}" aria-pressed="${m === sheet.method}">${esc(methodName(m))}</button>`
    ).join('');
  }

  // Son kullanılan "kategori + tutar" ikilileri (en fazla 5, tekrarsız)
  function recentPairs() {
    const map = catMap(), seen = new Set(), out = [];
    for (const e of state.entries) {
      if (e.type !== 'expense' || e.system || !e.categoryId || !map.has(e.categoryId)) continue;
      const k = e.categoryId + '|' + e.amount;
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(e);
      if (out.length === 5) break;
    }
    return out;
  }
  // Son 90 günde en sık kullanılan 4 kategori önce gelir
  function categoriesByUse() {
    const since = addDays(today(), -90), count = new Map();
    for (const e of state.entries) if (e.type === 'expense' && !e.system && e.categoryId && e.day >= since) count.set(e.categoryId, (count.get(e.categoryId) || 0) + 1);
    const top = [...count].sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
    const topCats = top.map(id => state.categories.find(c => c.id === id)).filter(Boolean);
    return { top: new Set(top), list: topCats.concat(state.categories.filter(c => !top.includes(c.id))) };
  }
  function renderRecent() {
    const sec = $('#recent-section');
    if (!sec || !sheet || sheet.kind !== 'entry') return;
    const pairs = sheet.id || sheet.type !== 'expense' ? [] : recentPairs();
    sec.hidden = !pairs.length;
    const map = catMap();
    $('#f-recent').innerHTML = pairs.map(e => {
      const c = map.get(e.categoryId);
      return `<button type="button" class="chip" data-action="quick-fill" data-id="${esc(e.id)}" style="${catStyle(c.color)}"><i class="dot"></i>${esc(c.name)} ${money(e.amount)}</button>`;
    }).join('');
  }

  function renderChips() {
    const wrap = $('#f-chips');
    if (!wrap || !sheet || sheet.kind !== 'entry') return;
    const { top, list } = categoriesByUse();
    const chips = list.map(c =>
      `<button type="button" class="chip${top.has(c.id) ? ' chip-top' : ''}" data-action="pick-cat" data-id="${esc(c.id)}" aria-pressed="${c.id === sheet.categoryId}" style="${catStyle(c.color)}"><i class="dot"></i>${esc(c.name)}</button>`
    );
    chips.push(`<button type="button" class="chip chip-add" data-action="nc-open">+ Yeni kategori</button>`);
    wrap.innerHTML = chips.join('');
  }

  function saveEntry() {
    const f = sheet;
    if (!f || f.kind !== 'entry') return;
    const amount = parseAmount($('#f-amount').value);
    const day = $('#f-day').value;
    const catOk = f.type === 'income' || f.system || state.categories.some(c => c.id === f.categoryId);
    const dayOk = /^\d{4}-\d{2}-\d{2}$/.test(day);
    $('#err-amount').hidden = amount !== null;
    $('#err-cat').hidden = catOk;
    $('#err-day').hidden = dayOk;
    if (amount === null) { $('#f-amount').focus(); return; }
    if (!catOk || !dayOk) return;

    const entry = {
      id: f.id || newId(),
      type: f.type,
      amount,
      categoryId: f.type === 'expense' ? f.categoryId : null,
      note: $('#f-note').value.trim().slice(0, 80),
      isSalary: f.type === 'income' && $('#f-salary').checked,
      method: methodOptions(f.type).includes(f.method) || (f.method.startsWith('card:') && (f.type === 'expense' || f.system)) ? f.method : 'bank',
      system: f.system || null,
      day,
      createdAt: f.createdAt || Date.now(),
    };
    const ok = commit(() => {
      if (entry.isSalary) state.period = null;
      if (f.id) state.entries = state.entries.map(e => (e.id === f.id ? entry : e));
      else state.entries.push(entry);
    }, f.id ? 'Değişiklik kaydedildi' : f.type === 'income' ? 'Gelir eklendi' : 'Harcama eklendi');
    if (ok) closeSheet();
  }

  function saveInlineCategory() {
    const f = sheet;
    if (!f || f.kind !== 'entry') return;
    const name = $('#nc-name').value.trim();
    const err = nameError(name, null);
    const errEl = $('#nc-err');
    errEl.textContent = err || '';
    errEl.hidden = !err;
    if (err) { $('#nc-name').focus(); return; }
    const id = newId();
    const ok = commit(() => { state.categories.push({ id, name, color: f.ncColor, limit: null, createdAt: Date.now() }); });
    if (!ok || sheet !== f) return;
    f.categoryId = id;
    $('#newcat').hidden = true;
    $('#nc-name').value = '';
    $('#err-cat').hidden = true;
    renderChips();
  }

  // Kategori ekleme / düzenleme
  function openCategorySheet(id = null) {
    if (!canWrite()) return;
    const existing = id ? state.categories.find(c => c.id === id) : null;
    const ctx = { kind: 'category', id: existing ? existing.id : null, color: existing ? existing.color : suggestColor(), createdAt: existing ? existing.createdAt : 0 };
    const html = sheetHead(existing ? 'Kategoriyi düzenle' : 'Yeni kategori') + `
      <form class="form" id="cat-form" novalidate>
        <label class="field"><span>Kategori adı</span><input id="c-name" maxlength="30" autocomplete="off" placeholder="ör. Kahve, Spor, Evcil hayvan" aria-describedby="c-err"><small class="err" id="c-err" hidden></small></label>
        <div class="field"><span class="field-label">Renk</span><div class="swatches" id="c-swatches">${swatches(ctx.color, 'cs-color')}</div></div>
        <label class="field"><span>Dönemlik bütçe limiti (isteğe bağlı)</span>
          <span class="amount-wrap"><input id="c-limit" class="limit-input" inputmode="decimal" autocomplete="off" placeholder="Limit yok"><span class="suffix">₺</span></span>
          <small class="sub">Her maaş döneminde bu kategoriye en fazla ne kadar harcamak istediğini gir. Boş bırakırsan limit olmaz.</small>
